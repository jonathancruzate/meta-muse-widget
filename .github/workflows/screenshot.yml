name: Widget screenshots

# Captures genuine emulator screenshots of the Muse Widget Customize
# screen using the *shipped* release APK (not a debug build), on a
# KVM-accelerated GitHub-hosted runner. See docs/SCREENSHOT-CI.md.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/screenshot.yml

env:
  # Pinned to the latest GitHub Release at the time this workflow was
  # added. Update these two values when a newer release ships.
  RELEASE_TAG: v4.10.0
  APK_NAME: Muse-Widget-4.10.0.apk
  APK_SHA256: 73c984155a8c735b45fe912860d82f5951531def77ea72b3de3d8a686b887d45
  APP_ID: com.samsung.oneui9.metamusewidget

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/checkout@v4

      - name: Download the release APK
        run: |
          curl -L -o muse-widget.apk "https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/${APK_NAME}"
          echo "${APK_SHA256}  muse-widget.apk" | sha256sum -c -
          ls -l muse-widget.apk

      - name: Run emulator and capture the Customize screen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
              bash scripts/capture-screenshots.sh
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: widget-screenshots
          path: |
            screenshot-oneui.png
            screenshot-pixel.png
            window_dump.xml
          if-no-files-found: warn
